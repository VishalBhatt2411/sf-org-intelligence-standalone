    <title>Salesforce Tech Debt AI</title>
    <style>
      /* Self-hosted (not Google Fonts CDN): the combined ":wght@400;500" query
         param serves the SAME file for both weights, so 500 never rendered as
         a distinct medium cut. Per-weight files fix that. */
      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 400;
        font-style: normal;
        font-display: swap;
        src: url("/fonts/jetbrainsmono-400.woff2") format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 500;
        font-style: normal;
        font-display: swap;
        src: url("/fonts/jetbrainsmono-500.woff2") format("woff2");
      }
    </style>
